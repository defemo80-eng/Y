name: Compilar e Instalar ChatDep APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Pruebas y Compilación APK (Debug y Release)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Android SDK y aceptar licencias
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$SDK_ROOT/licenses"
          SDKMANAGER="$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          if [ -n "$SDKMANAGER" ]; then
            (yes || true) | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          fi
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > "$SDK_ROOT/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n" > "$SDK_ROOT/licenses/android-sdk-preview-license"

      - name: Configurar Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Restaurar debug.keystore desde debug.keystore.base64
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey

      - name: Ejecutar pruebas unitarias y Robolectric
        run: gradle :app:testDebugUnitTest --no-daemon --max-workers=2 --stacktrace -Dorg.gradle.jvmargs="-Xmx2560m -Dfile.encoding=UTF-8"

      - name: Compilar APK Debug
        run: gradle :app:assembleDebug --no-daemon --max-workers=2 --stacktrace -Dorg.gradle.jvmargs="-Xmx2560m -Dfile.encoding=UTF-8"

      - name: Preparar firma Release y compilar APK Release
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$SECRET_STORE_PASSWORD" ] && [ -n "$SECRET_KEY_PASSWORD" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
            export KEYSTORE_PATH="$GITHUB_WORKSPACE/my-upload-key.jks"
            export STORE_PASSWORD="$SECRET_STORE_PASSWORD"
            export KEY_PASSWORD="$SECRET_KEY_PASSWORD"
            echo "RELEASE_SIGNING_MODE=Firma oficial de producción (GitHub Secrets)" >> "$GITHUB_ENV"
          else
            CI_PASS="chatdep-ci-$(date +%s)"
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$CI_PASS" \
              -keypass "$CI_PASS" \
              -dname "CN=ChatDep, OU=Mobile, O=ChatDep, L=Madrid, ST=Madrid, C=ES"
            export KEYSTORE_PATH="$GITHUB_WORKSPACE/my-upload-key.jks"
            export STORE_PASSWORD="$CI_PASS"
            export KEY_PASSWORD="$CI_PASS"
            echo "RELEASE_SIGNING_MODE=Firma automática de CI (configura RELEASE_KEYSTORE_BASE64 para actualizaciones con firma fija)" >> "$GITHUB_ENV"
          fi
          gradle :app:assembleRelease --no-daemon --max-workers=2 --stacktrace -Dorg.gradle.jvmargs="-Xmx2560m -Dfile.encoding=UTF-8"

      - name: Preparar APKs para descarga
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/ChatDep-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/ChatDep-release.apk
          ls -lh dist/

      - name: Subir APK Release (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ChatDep-release-apk
          path: dist/ChatDep-release.apk
          retention-days: 30

      - name: Subir APK Debug (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ChatDep-debug-apk
          path: dist/ChatDep-debug.apk
          retention-days: 30

      - name: Publicar APKs directos en GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ChatDep APK (${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Última compilación' }})
          make_latest: true
          body: |
            Compilación automática de **ChatDep** (`com.chatdep.ia`).

            ### Descargar e instalar en Android
            - **Para instalar y compartir en varios teléfonos (recomendado):** descarga **`ChatDep-release.apk`** (usa Firebase App Check con reCAPTCHA Enterprise, compatible con cualquier teléfono).
            - **Solo para pruebas locales/emulador:** **`ChatDep-debug.apk`**.

            **Estado de firma:** ${{ env.RELEASE_SIGNING_MODE }}
          files: |
            dist/ChatDep-release.apk
            dist/ChatDep-debug.apk
